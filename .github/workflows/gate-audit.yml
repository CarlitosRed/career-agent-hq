name: gate audit
# Copy into a project's own .github/workflows/. Detective control, not preventive: GitHub branch
# protection (which would actually BLOCK a bad push or merge-button click) needs a public repo or a
# paid plan, neither of which this framework assumes a project has. This is the next best thing -
# after every push to the base branch, check that each new commit carries a Gate-Record line (written
# only by the pinned `gate.py merge`). If one does not, open an issue so the Program Owner sees it
# within minutes instead of never. Generalized from advance-po-reader's project-specific version (R23).
# The framework pin and the gate config are read from the commit BEFORE the push, so a push cannot edit
# the rules it is audited by. When that commit has no pin and config yet (the push that adds them, or the
# first push to the base branch) there were no rules to bypass and the run says so and stops.
#
# Copied from agent-orchestration templates/gate-audit.yml at tag v0.9.2 (.orchestration/framework.pin),
# with `branches: [main]` changed to `branches: [master]` to match this project's own gate.json `base`
# (career-agent-hq has always used `master`, unlike the framework repo itself, which uses `main`). Not
# auto-updated by a later framework release; this project updates its copy by its own PR at a new pin.
on:
  push:
    branches: [master]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the previous master (the rules this push is audited by)
        id: before
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if echo "$BEFORE" | grep -qE '^0+$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No previous commit on master; nothing to audit."
            exit 0
          fi
          git worktree add --detach .trusted "$BEFORE"
          if [ ! -f .trusted/.orchestration/framework.pin ] || [ ! -f .trusted/.orchestration/gate.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The previous master has no .orchestration/framework.pin and gate.json; there were no rules to bypass."
            exit 0
          fi
          repo=$(grep '^repo:' .trusted/.orchestration/framework.pin | sed 's/^repo: *//')
          tag=$(grep '^tag:' .trusted/.orchestration/framework.pin | sed 's/^tag: *//')
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Fetch the pinned framework (shallow, at the pinned tag only)
        if: steps.before.outputs.skip != 'true'
        env:
          FRAMEWORK_PIN_TOKEN: ${{ secrets.FRAMEWORK_PIN_TOKEN }}
          PIN_REPO: ${{ steps.before.outputs.repo }}
          PIN_TAG: ${{ steps.before.outputs.tag }}
        run: |
          repo_no_scheme="${PIN_REPO#https://}"
          # Try a plain, unauthenticated clone first - this is the only path needed when the
          # framework repo is public, and it needs no secret at all.
          if git clone --depth 1 --branch "$PIN_TAG" \
               "https://${repo_no_scheme}" .framework-pin 2>/tmp/clone-plain.err; then
            exit 0
          fi
          cat /tmp/clone-plain.err >&2
          if [ -z "$FRAMEWORK_PIN_TOKEN" ]; then
            echo "::error::Plain clone of the pinned framework failed and FRAMEWORK_PIN_TOKEN is not set." \
                 "If the framework repo is private, see adapters/README.md, 'Private framework repo access'." \
                 "If it should be public, check the repo/tag in .orchestration/framework.pin." >&2
            exit 1
          fi
          # Framework repo is private - retry authenticated. Strip any stray whitespace/CRLF a
          # copy-paste into the secret may have carried - a PAT never legitimately contains
          # whitespace, and an embedded CR/space breaks the URL below with curl's "Malformed input
          # to a URL function" rather than an auth error.
          FRAMEWORK_PIN_TOKEN="$(printf '%s' "$FRAMEWORK_PIN_TOKEN" | tr -d '[:space:]')"
          git clone --depth 1 --branch "$PIN_TAG" \
            "https://x-access-token:${FRAMEWORK_PIN_TOKEN}@${repo_no_scheme}" .framework-pin

      - uses: actions/setup-python@v5
        if: steps.before.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Audit the new commits
        id: audit
        if: steps.before.outputs.skip != 'true'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python .framework-pin/tools/gate/gate.py --config .trusted/.orchestration/gate.json \
            audit --range "$BEFORE..$AFTER" 2>&1 | tee audit.txt

      - name: Open an issue when the gate was bypassed
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "${{ github.repository }}" --title "Gate bypassed on master (${GITHUB_SHA::8})" --body-file audit.txt
